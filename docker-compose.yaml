services:
  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: valkey
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  valkey_data: